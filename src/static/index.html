<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-header">
      <div class="mascot-row" aria-label="School mascot gallery">
        <img src="https://octodex.github.com/images/Professortocat_v2.png" alt="Professor Octocat" />
        <img src="https://octodex.github.com/images/boxertocat_octodex.jpg" alt="Boxer Octocat" />
        <img src="https://octodex.github.com/images/saint_nicktocat.jpg" alt="Saint Nick Octocat" />
      </div>
      <div class="header-content">
        <h1>Mergington High School</h1>
        <h2>Extracurricular Activities</h2>
      </div>
      <div class="teacher-access" aria-live="polite">
        <button id="teacher-toggle" class="teacher-button" type="button" aria-label="Teacher login">
          <span class="teacher-icon">👩‍🏫</span>
          <span id="teacher-status">Guest</span>
        </button>
      </div>
    </header>

    <main class="page-shell">
      <section id="activities-container" class="panel large-panel">
        <div class="panel-header">
          <h3>Available Activities</h3>
        </div>

        <div class="toolbar" aria-label="Activity filters">
          <input id="activity-search" type="search" placeholder="Search activities" />
          <select id="category-filter">
            <option value="all">All categories</option>
          </select>
          <select id="sort-select">
            <option value="name">Sort by name</option>
            <option value="availability">Sort by availability</option>
            <option value="schedule">Sort by schedule</option>
          </select>
        </div>

        <div id="activities-list" aria-live="polite">
          <p>Loading activities...</p>
        </div>
      </section>
    </main>

    <div id="teacher-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="teacher-modal-title">
      <div class="modal-content">
        <h3 id="teacher-modal-title">Teacher Login</h3>
        <form id="teacher-login-form">
          <div class="form-group">
            <label for="teacher-username">Username</label>
            <input id="teacher-username" name="teacher-username" type="text" required />
          </div>
          <div class="form-group">
            <label for="teacher-password">Password</label>
            <input id="teacher-password" name="teacher-password" type="password" required />
          </div>
          <div class="modal-actions">
            <button type="submit">Login</button>
            <button type="button" class="secondary-button" id="cancel-login">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="message" class="message hidden" role="status"></div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
